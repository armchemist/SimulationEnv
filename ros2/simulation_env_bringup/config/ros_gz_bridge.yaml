# ros_gz_bridge topic map for the lab_bench world.
# Loaded by parameter_bridge via the `config_file` parameter.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Rail carriage: commanded position in metres, +/-0.42 from the rail centre.
- ros_topic_name: "/rail_axis/carriage_slide/cmd_pos"
  gz_topic_name: "/rail_axis/carriage_slide/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Rail carriage joint state (position / velocity / effort).
- ros_topic_name: "/rail_axis/joint_states"
  gz_topic_name: "/world/lab_bench/model/rail_axis/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Pose of every model in the world, for debugging layout coordinates.
- ros_topic_name: "/lab_bench/pose_info"
  gz_topic_name: "/world/lab_bench/dynamic_pose/info"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
